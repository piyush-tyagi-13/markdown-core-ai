# mdcore retrieval evaluation - 25 questions from your vault
#
# Replace every entry below with a real question you would ask your own vault.
# The question should be something where you already roughly know the answer
# so you can judge whether the synthesis was useful.
#
# expected_topics: loose keywords you expect to appear in a good answer.
# These are used as soft hints for the LLM judge, not exact match.
#
# HOW TO PICK GOOD QUESTIONS:
# - Use queries that span multiple notes (tests stitching)
# - Use decision-type queries ("what was decided about X?")
# - Use project-specific queries that generic search engines couldn't answer
# - Mix recent notes with older ones
# - Include at least 3-4 queries where you expect NO good result (tests false positive rate)

questions:
  # --- Xbox Ally X / SteamOS projects ---
  - query: "how does the Ally Vibe Control plugin control grip motor vibration on the ASUS Ally X?"
    expected_topics: ["sysfs", "asus_ally_hid", "motor", "intensity", "decky"]

  # --- mdcore / personal projects ---
  - query: "what is mdcore and what problem does it solve?"
    expected_topics: ["knowledge base", "markdown", "RAG", "vault", "retrieval"]

  # --- Lloyds / CMAS-CBS work ---
  - query: "what is the environment design overview for the CMAS-CBS integration?"
    expected_topics: ["environment", "CMAS", "CBS", "DevOps", "design"]

  # --- Java / Programming notes ---
  - query: "what is the difference between JDK, JRE, and JVM?"
    expected_topics: ["JDK", "JRE", "JVM", "compile", "runtime"]

  # --- Expect NO result (false positive test) ---
  - query: "what are my notes on Rust ownership and borrow checker patterns?"
    expected_topics: []

