name: CI

on:
  pull_request:
  push:
    branches: ["master"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + extras needed by tests
        # serve extra provides fastapi for test_server.py
        run: pip install -e ".[serve]" pytest
      - name: Seed a minimal config
        # mdcore/mcp_server/server.py calls load_config() at import time, so the
        # module (and its tests) cannot be imported without a config present.
        # ollama backend needs no heavy deps or network to construct.
        run: |
          mkdir -p ~/.mdcore
          cat > ~/.mdcore/config.yaml <<'YAML'
          vault:
            path: ./tests/fixtures/eval/vault
          embeddings:
            backend: ollama
            local_model: nomic-embed-text
          llm:
            backend: ollama
            model: none
          vector_store:
            persist_path: ./.eval-index/chroma_db
          YAML
      - name: Run unit tests
        # Aggregator tests need the optional llm_keypool dependency; skip them here.
        run: pytest -q --ignore=tests/test_llm_layer_aggregator.py

  retrieval-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install package + HF embedding backend + LangSmith
        run: pip install -e ".[huggingface]" langsmith
      - name: Offline retrieval gate (fixture vault)
        env:
          # Optional: if the secret is configured, results are posted to LangSmith.
          # The gate runs fully offline and passes/fails regardless of this key.
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: mdcore
          TOKENIZERS_PARALLELISM: "false"
        run: python scripts/ci_retrieval_eval.py --min-recall 0.8
